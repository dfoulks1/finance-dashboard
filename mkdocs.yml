site_name: ASF Financial Dashboard — Dev Docs
site_description: >-
  Development documentation and progress for the AI-assisted Apache Software
  Foundation financial dashboard.
site_author: ASF Financial Dashboard contributors
# Update to the published base URL once hosting is finalized (GitHub Pages / ASF).
site_url: https://dfoulks1.github.io/finance-dashboard/

repo_name: dfoulks1/finance-dashboard
repo_url: https://github.com/dfoulks1/finance-dashboard
edit_uri: edit/main/docs/

copyright: >-
  Documentation is AI-assisted and human-reviewed before publication
  (see the AI Contribution Guide §3.5). Licensed under Apache-2.0.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      # Lets docs pages pull in repo-root files (e.g. CONTRIBUTING.md) as the
      # single source of truth: use `--8<-- "CONTRIBUTING.md"` in a page.
      base_path:
        - .
        - ..
      check_paths: true

nav:
  - Home: index.md
  - AI Contribution Guide: ai-contribution.md
  - Prompt System: prompt-system.md
  - Architecture: architecture.md
  - Software Map: software-map.md
  - SBOM: sbom.md
  - Development Progress: progress.md
  - Policy Compliance: policy-compliance.md

plugins:
  - search
